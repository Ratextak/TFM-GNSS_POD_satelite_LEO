[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=5000000
GNSS-SDR.use_acquisition_resampler=true

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=30000000
SignalSource.samples=0
SignalSource.enable_throttle_control=false

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex

InputFilter.implementation=Freq_Xlating_Fir_Filter
InputFilter.dump=false
;InputFilter.dump_filename=/

InputFilter.filter_type=lowpass
InputFilter.grid_density=16  ; Si filter_type=lowpass no tiene efecto.
InputFilter.sampling_frequency=30000000
InputFilter.IF=0
InputFilter.decimation_factor=6

InputFilter.input_item_type=gr_complex
InputFilter.output_item_type=gr_complex
InputFilter.taps_item_type=float
InputFilter.number_of_taps=5  ; Si filter_type=lowpass no tiene efecto.
InputFilter.number_of_bands=2  ; Si filter_type=lowpass no tiene efecto.

InputFilter.band1_begin=0.0  ; Si filter_type=lowpass no tiene efecto.
InputFilter.band1_end=0.45  ; Si filter_type=lowpass no tiene efecto.
InputFilter.band2_begin=0.55  ; Si filter_type=lowpass no tiene efecto.
InputFilter.band2_end=1.0  ; Si filter_type=lowpass no tiene efecto.

InputFilter.ampl1_begin=1.0  ; Si filter_type=lowpass no tiene efecto.
InputFilter.ampl1_end=1.0  ; Si filter_type=lowpass no tiene efecto.
InputFilter.ampl2_begin=0.0  ; Si filter_type=lowpass no tiene efecto.
InputFilter.ampl2_end=0.0  ; Si filter_type=lowpass no tiene efecto.

InputFilter.band1_error=1.0  ; Si filter_type=lowpass no tiene efecto.
InputFilter.band2_error=1.0  ; Si filter_type=lowpass no tiene efecto.

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8 ;GPS 
Channels_1B.count=8 ;GAL
Channels.in_acquisition=16

;######### GPS ACQUISITION CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.threshold=3
Acquisition_1C.doppler_max=40000
Acquisition_1C.doppler_min=-40000
Acquisition_1C.doppler_step=125

Acquisition_1C.dump=false
Acquisition_1C.dump_filename=./acq_dump_GPS.dat

;######### ACQUISITION GALILEO CONFIG ############
Acquisition_1B.implementation=Galileo_E1_PCPS_Ambiguous_Acquisition
Acquisition_1B.item_type=gr_complex
Acquisition_1B.coherent_integration_time_ms=4
Acquisition_1B.threshold=2
Acquisition_1B.doppler_max=40000
Acquisition_1B.doppler_min=-40000
Acquisition_1B.doppler_step=125

Acquisition_1B.dump=false
Acquisition_1B.dump_filename=./acq_dump_Galileo.dat

;######### TRACKING GPS CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.extend_correlation_symbols=1
Tracking_1C.pll_bw_hz=45.0
Tracking_1C.dll_bw_hz=5.0
Tracking_1C.pll_bw_narrow_hz=7.0
Tracking_1C.dll_bw_narrow_hz=2.5
Tracking_1C.enable_fll_pull_in=false
Tracking_1C.enable_fll_steady_state=false
Tracking_1C.fll_bw_hz=5.0
Tracking_1C.high_dynamics=true

Tracking_1C.dump=true
Tracking_1C.dump_filename=../data/GNSS-SDR/aux/Tracking/epl_tracking_ch_

;######### TRACKING GALILEO CONFIG ############
Tracking_1B.implementation=Galileo_E1_DLL_PLL_VEML_Tracking
Tracking_1B.item_type=gr_complex
Tracking_1B.extend_correlation_symbols=1
Tracking_1B.pll_bw_hz=45.0
Tracking_1B.dll_bw_hz=5.0
Tracking_1B.pll_bw_narrow_hz=7.0
Tracking_1B.dll_bw_narrow_hz=2.5
Tracking_1B.enable_fll_pull_in=false
Tracking_1B.enable_fll_steady_state=false
Tracking_1B.fll_bw_hz=5.0
Tracking_1B.high_dynamics=true

Tracking_1B.dump=true
Tracking_1B.dump_filename=../data/GNSS-SDR/aux/Tracking/epl_tracking_ch_

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

;######### TELEMETRY DECODER GALILEO CONFIG ############
TelemetryDecoder_1B.implementation=Galileo_E1B_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=../data/GNSS-SDR/aux/observables.dat

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.rinex_output_enabled=true
PVT.positioning_mode=Single
PVT.enable_pvt_kf=true
PVT.output_rate_ms=50
PVT.display_rate_ms=1000
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.rtk_trace_level=5

PVT.output_path=../data/GNSS-SDR/aux
PVT.dump=true
PVT.dump_filename=../data/GNSS-SDR/aux/pvt.dat

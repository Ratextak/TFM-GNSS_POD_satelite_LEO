[GNSS-SDR]

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=30000000


;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=File_Signal_Source
SignalSource.item_type=ibyte
SignalSource.sampling_frequency=30000000
SignalSource.samples=0

;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Ibyte_To_Complex
InputFilter.implementation=Pass_Through
InputFilter.item_type=gr_complex
Resampler.implementation=Pass_Through
Resampler.item_type=gr_complex

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=19 ;GPS 
Channels.in_acquisition=19

Channel0.satellite=1
Channel1.satellite=3
Channel2.satellite=6
Channel3.satellite=7
Channel4.satellite=8
Channel5.satellite=9
Channel6.satellite=11
Channel7.satellite=12
Channel8.satellite=14
Channel9.satellite=15
Channel10.satellite=17
Channel11.satellite=18
Channel12.satellite=19
Channel13.satellite=21
Channel14.satellite=22
Channel15.satellite=24
Channel16.satellite=26
Channel17.satellite=27
Channel18.satellite=28

;######### GPS ACQUISITION CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.coherent_integration_time_ms=1
Acquisition_1C.threshold=3 ;Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=40000
Acquisition_1C.doppler_min=-40000
Acquisition_1C.doppler_step=125

;######### TRACKING GPS CONFIG ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
Tracking_1C.extend_correlation_symbols=1
Tracking_1C.pll_bw_hz=45.0
Tracking_1C.dll_bw_hz=5.0
Tracking_1C.pll_bw_narrow_hz=7.0
Tracking_1C.dll_bw_narrow_hz=2.5
Tracking_1C.enable_fll_pull_in=false
Tracking_1C.enable_fll_steady_state=false
Tracking_1C.fll_bw_hz=5.0
Tracking_1C.high_dynamics=false
Tracking_1C.max_lock_fail=20

Tracking_1C.dump=true
Tracking_1C.dump_filename=../data/GNSS-SDR/Combinación/Tracking/epl_tracking_ch_

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder

;######### OBSERVABLES CONFIG ############
Observables.implementation=Hybrid_Observables
Observables.dump=true
Observables.dump_filename=../data/GNSS-SDR/Combinación/observables.dat

;######### PVT CONFIG ############
PVT.implementation=RTKLIB_PVT
PVT.rinex_output_enabled=true
PVT.positioning_mode=Single
PVT.enable_pvt_kf=true
PVT.output_rate_ms=50
PVT.display_rate_ms=1000
PVT.iono_model=Broadcast
PVT.trop_model=Saastamoinen
PVT.rtk_trace_level=5

PVT.output_path=../data/GNSS-SDR/Combinación
PVT.dump=true
PVT.dump_filename=../data/GNSS-SDR/Combinación/pvt.dat

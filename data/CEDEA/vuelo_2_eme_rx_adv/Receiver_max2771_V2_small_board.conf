[GNSS-SDR] 
GNSS-SDR.enable_FPGA=true

;######### GLOBAL OPTIONS ##################
GNSS-SDR.internal_fs_sps=16368000 ; 8184000 ; 4092000 ; 8184000 ; 16368000
;GNSS-SDR.telecommand_enabled=true
;GNSS-SDR.telecommand_tcp_port=3333
;GNSS-SDR.observable_interval_ms=1000

;######### SIGNAL_SOURCE CONFIG ############
SignalSource.implementation=MAX2771_EVKIT_Signal_Source_FPGA
SignalSource.freq=1575420000
SignalSource.sampling_frequency=16368000 ; 4092000 ; 8184000 ; 16368000
SignalSource.bandwidth=4200000 ; 4200000 ; 8700000 ; 16400000
SignalSource.LNA_active=false
SignalSource.enable_IF_filter_gain=true
SignalSource.enable_AGC=true
SignalSource.filter_order=5
;SignalSource.PGA_gain=63


;######### SIGNAL_CONDITIONER CONFIG ############
SignalConditioner.implementation=Pass_Through

;######### CHANNELS GLOBAL CONFIG ############
Channels_1C.count=8
Channels_1B.count=8
Channels_L5.count=0
Channels_5X.count=0
Channels.in_acquisition=1


;######### GPS ACQUISITION CONFIG ############
Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition_FPGA
Acquisition_1C.threshold=2.25
Acquisition_1C.doppler_max=10000 ; 50000            ; 50 kHz is the max Doppler Frequency for a Low-Earth Orbit satellite. Reduce it if posible for your scenario, the acquisition will work much faster
Acquisition_1C.doppler_step=250
Acquisition_1C.make_two_steps=true
Acquisition_1C.second_nbins=5 ; 30               ; only applicable if make_two_steps = true
Acquisition_1C.second_doppler_step=250      ; only applicable if make_two_steps = true
Acquisition_1C.max_num_acqs=50 ; 50               ; only applicable if make_two_steps = true : increase sensitivity by repeating the second step
;Acquisition_1C.total_block_exp=1


;######### GALILEO ACQUISITION CONFIG ############
Acquisition_1B.implementation=Galileo_E1_PCPS_Ambiguous_Acquisition_FPGA
Acquisition_1B.acquire_pilot=true
Acquisition_1B.threshold=2.25
Acquisition_1B.doppler_max=10000            ; 50 kHz is the max Doppler Frequency for a Low-Earth Orbit satellite. Reduce it if posible for your scenario, the acquisition will work much faster   
Acquisition_1B.doppler_step=125 
Acquisition_1B.make_two_steps=true
Acquisition_1B.second_nbins=10               ; only applicable if make_two_steps = true
Acquisition_1B.second_doppler_step=125      ; only applicable if make_two_steps = true
Acquisition_1B.max_num_acqs=8               ; only applicable if make_two_steps = true : increase sensitivity by repeating the second step
;Acquisition_1B.total_block_exp=1


;######### TRACKING GPS CONFIG 2 ms integration ############
Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking_FPGA
;Tracking_1C.extend_correlation_symbols=2
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.early_late_space_narrow_chips=0.15 ; 0.1 ; 0.15
Tracking_1C.pll_bw_hz=40 ; 25 ; 40
Tracking_1C.dll_bw_hz=4.0h ; 2.0 ; 4.0
Tracking_1C.pll_bw_narrow_hz=5.0 ; 10.0 ; 5.0
Tracking_1C.dll_bw_narrow_hz=2.0
Tracking_1C.fll_bw_hz=10
Tracking_1C.enable_high_dynamics=true
Tracking_1C.enable_fll_pull_in=true
Tracking_1C.enable_fll_steady_state=false	
Tracking_1C.dump=false
Tracking_1C.dump_mat=false
Tracking_1C.dump_filename=GPS_tracking/tracking_ch_


;######### TRACKING GLOBAL CONFIG ############
Tracking_1B.implementation=Galileo_E1_DLL_PLL_VEML_Tracking_FPGA
Tracking_1B.pll_bw_hz=20.0;
Tracking_1B.dll_bw_hz=2.0;
Tracking_1B.order=3;
Tracking_1B.early_late_space_chips=0.15;
Tracking_1B.very_early_late_space_chips=0.6;
Tracking_1B.enable_fll_pull_in=true;
Tracking_1B.enable_fll_steady_state=false
Tracking_1B.fll_bw_hz=10
Tracking_1B.dump=false
Tracking_1B.dump_filename=./veml_tracking_ch_

;######### TELEMETRY DECODER GPS CONFIG ############
TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
TelemetryDecoder_1C.dump=false

;######### TELEMETRY DECODER GALILEO CONFIG ############
TelemetryDecoder_1B.implementation=Galileo_E1B_Telemetry_Decoder
TelemetryDecoder_1B.dump=false
TelemetryDecoder_1B.dump_crc_stats=false

;######### OBSERVABLES CONFIG ############
;#implementation:
Observables.implementation=Hybrid_Observables
Observables.dump=false
Observables.dump_filename=./observables.dat


;######### PVT CONFIG ############
;#implementation: Position Velocity and Time (PVT) implementation:
PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single  ; options: Single, Static, Kinematic, PPP_Static, PPP_Kinematic
PVT.raim_fde=0
PVT.iono_model=Broadcast ; options: OFF, Broadcast, SBAS, Iono-Free-LC, Estimate_STEC, IONEX
PVT.trop_model=Saastamoinen ; options: OFF, Saastamoinen, SBAS, Estimate_ZTD, Estimate_ZTD_Grad
PVT.enable_pvt_kf=false
PVT.enable_rx_clock_correction=true
PVT.flag_rtcm_server=false
PVT.flag_rtcm_tty_port=false
PVT.rtcm_dump_devname=/dev/pts/1
PVT.output_enabled=false
PVT.dump=true
PVT.dump_mat=true
PVT.dump_filename=./PVT
PVT.output_rate_ms=40
PVT.display_rate_ms=1000

PVT.rinex_output_enabled=true ; true
PVT.rinexobs_rate_ms=100

PVT.xml_output_enabled=true

PVT.an_output_enabled=true
PVT.an_dump_devname=/dev/ttyPS1










































































